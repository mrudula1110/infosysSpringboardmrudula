<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — InsureAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-purple-600 rounded-lg 
                            flex items-center justify-center">
                    <span class="text-white font-bold text-sm">AI</span>
                </div>
                <span class="text-xl font-bold">InsureAI</span>
                <span class="ml-2 text-xs bg-red-900/50 text-red-400 
                             px-2 py-1 rounded-full">Admin</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="userName" class="text-gray-400 text-sm"></span>
                <button onclick="logout()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 
                               rounded-lg text-sm transition">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">

        <div class="mb-8">
            <h1 class="text-3xl font-bold">Admin Dashboard</h1>
            <p class="text-gray-400 mt-1">
                Manage all platform data
            </p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
                <div class="text-gray-400 text-sm mb-1">Total Users</div>
                <div id="totalUsers" class="text-2xl font-bold text-purple-400">-</div>
            </div>
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
                <div class="text-gray-400 text-sm mb-1">Total Plans</div>
                <div id="totalPlans" class="text-2xl font-bold text-purple-400">-</div>
            </div>
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
                <div class="text-gray-400 text-sm mb-1">Appointments</div>
                <div id="totalAppointments" class="text-2xl font-bold text-purple-400">-</div>
            </div>
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
                <div class="text-gray-400 text-sm mb-1">Insurance</div>
                <div id="totalInsurance" class="text-2xl font-bold text-purple-400">-</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-2 mb-8 border-b border-gray-800 
                    overflow-x-auto">
            <button onclick="showTab('users')" id="tab-users" class="px-4 py-2 text-sm font-medium border-b-2 
                           border-purple-500 text-purple-400 
                           whitespace-nowrap transition">
                Users
            </button>
            <button onclick="showTab('plans')" id="tab-plans" class="px-4 py-2 text-sm font-medium border-b-2 
                           border-transparent text-gray-400 
                           whitespace-nowrap hover:text-white transition">
                Plans
            </button>
            <button onclick="showTab('appointments')" id="tab-appointments" class="px-4 py-2 text-sm font-medium border-b-2 
                           border-transparent text-gray-400 
                           whitespace-nowrap hover:text-white transition">
                Appointments
            </button>
            <button onclick="showTab('addplan')" id="tab-addplan" class="px-4 py-2 text-sm font-medium border-b-2 
                           border-transparent text-gray-400 
                           whitespace-nowrap hover:text-white transition">
                + Add Plan
            </button>
        </div>

        <!-- Users Tab -->
        <div id="tab-content-users">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-gray-400 border-b border-gray-800">
                            <th class="text-left py-3 px-4">ID</th>
                            <th class="text-left py-3 px-4">Name</th>
                            <th class="text-left py-3 px-4">Email</th>
                            <th class="text-left py-3 px-4">Role</th>
                            <th class="text-left py-3 px-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                        <tr>
                            <td colspan="5" class="text-gray-500 py-4 px-4">
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Plans Tab -->
        <div id="tab-content-plans" class="hidden">
            <div class="grid md:grid-cols-3 gap-4" id="plansList">
                <div class="text-gray-500 text-sm">Loading plans...</div>
            </div>
        </div>

        <!-- Appointments Tab -->
        <div id="tab-content-appointments" class="hidden">
            <div class="space-y-4" id="appointmentsList">
                <div class="text-gray-500 text-sm">
                    Loading appointments...
                </div>
            </div>
        </div>

        <!-- Add Plan Tab -->
        <div id="tab-content-addplan" class="hidden">
            <div class="max-w-lg">
                <h2 class="text-xl font-semibold mb-6">Add New Plan</h2>

                <div id="planSuccess" class="hidden bg-green-900/30 border border-green-700/50 
                            text-green-400 rounded-lg px-4 py-3 mb-4 text-sm">
                </div>

                <div class="bg-gray-900 border border-gray-800 
                            rounded-2xl p-6 space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">
                            Plan Name
                        </label>
                        <input id="planName" type="text" placeholder="e.g. Premium Health Plan" class="w-full bg-gray-800 border border-gray-700 
                                      rounded-xl px-4 py-3 text-white 
                                      placeholder-gray-500 focus:outline-none 
                                      focus:border-purple-500 transition" />
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">
                            Plan Type
                        </label>
                        <select id="planType" class="w-full bg-gray-800 border border-gray-700 
                                       rounded-xl px-4 py-3 text-white 
                                       focus:outline-none focus:border-purple-500 
                                       transition">
                            <option>Health</option>
                            <option>Life</option>
                            <option>Vehicle</option>
                            <option>Property</option>
                            <option>Travel</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">
                            Description
                        </label>
                        <textarea id="planDesc" rows="3" placeholder="Plan description..." class="w-full bg-gray-800 border border-gray-700 
                                         rounded-xl px-4 py-3 text-white 
                                         placeholder-gray-500 focus:outline-none 
                                         focus:border-purple-500 transition">
                        </textarea>
                    </div>
                    <button onclick="addPlan()" class="w-full bg-purple-600 hover:bg-purple-700 
                                   rounded-xl py-3 font-semibold transition">
                        Add Plan
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API = 'http://localhost:8081';
        const token = localStorage.getItem('token');
        const name = localStorage.getItem('name');

        document.getElementById('userName').textContent = name;
        if (!token) window.location.href = '../login.html';

        const tabs = ['users', 'plans', 'appointments', 'addplan'];

        function showTab(tab) {
            tabs.forEach(t => {
                document.getElementById(`tab-content-${t}`)
                    .classList.add('hidden');
                document.getElementById(`tab-${t}`)
                    .classList.remove('border-purple-500', 'text-purple-400');
                document.getElementById(`tab-${t}`)
                    .classList.add('border-transparent', 'text-gray-400');
            });
            document.getElementById(`tab-content-${tab}`)
                .classList.remove('hidden');
            document.getElementById(`tab-${tab}`)
                .classList.add('border-purple-500', 'text-purple-400');

            if (tab === 'users') loadUsers();
            if (tab === 'plans') loadPlans();
            if (tab === 'appointments') loadAppointments();
        }

        async function loadStats() {
            try {
                const [users, plans, appointments, insurance] =
                    await Promise.all([
                        fetch(`${API}/api/admin/users`, {
                            headers: { Authorization: `Bearer ${token}` }
                        }).then(r => r.json()),
                        fetch(`${API}/api/admin/plans`, {
                            headers: { Authorization: `Bearer ${token}` }
                        }).then(r => r.json()),
                        fetch(`${API}/api/admin/appointments`, {
                            headers: { Authorization: `Bearer ${token}` }
                        }).then(r => r.json()),
                        fetch(`${API}/api/admin/insurance`, {
                            headers: { Authorization: `Bearer ${token}` }
                        }).then(r => r.json()),
                    ]);

                document.getElementById('totalUsers').textContent =
                    users.length;
                document.getElementById('totalPlans').textContent =
                    plans.length;
                document.getElementById('totalAppointments').textContent =
                    appointments.length;
                document.getElementById('totalInsurance').textContent =
                    insurance.length;
            } catch (err) {
                console.error('Stats error', err);
            }
        }

        async function loadUsers() {
            const res = await fetch(`${API}/api/admin/users`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const users = await res.json();
            document.getElementById('usersTable').innerHTML =
                users.map(u => `
                <tr class="border-b border-gray-800/50 
                           hover:bg-gray-900/50">
                    <td class="py-3 px-4 text-gray-400">${u.id}</td>
                    <td class="py-3 px-4">${u.name}</td>
                    <td class="py-3 px-4 text-gray-400">${u.email}</td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-1 rounded-full text-xs ${u.role === 'ADMIN'
                        ? 'bg-red-900/30 text-red-400'
                        : u.role === 'AGENT'
                            ? 'bg-blue-900/30 text-blue-400'
                            : 'bg-purple-900/30 text-purple-400'
                    }">${u.role}</span>
                    </td>
                    <td class="py-3 px-4">
                        <button onclick="deleteUser(${u.id})"
                                class="text-red-400 hover:text-red-300 
                                       text-xs transition">
                            Delete
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteUser(id) {
            if (!confirm('Delete this user?')) return;
            await fetch(`${API}/api/admin/users/${id}`, {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${token}` }
            });
            loadUsers();
            loadStats();
        }

        async function loadPlans() {
            const res = await fetch(`${API}/api/admin/plans`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const plans = await res.json();
            document.getElementById('plansList').innerHTML =
                plans.map(p => `
                <div class="bg-gray-900 border border-gray-800 
                            rounded-xl p-5">
                    <div class="flex justify-between items-start mb-3">
                        <span class="bg-purple-900/30 text-purple-400 
                                     text-xs px-2 py-1 rounded-full">
                            ${p.planType}
                        </span>
                        <button onclick="deletePlan(${p.id})"
                                class="text-red-400 hover:text-red-300 
                                       text-xs transition">
                            Delete
                        </button>
                    </div>
                    <h3 class="font-semibold mb-1">${p.planName}</h3>
                    <p class="text-gray-400 text-sm">
                        ${p.planDescription}
                    </p>
                </div>
            `).join('');
        }

        async function deletePlan(id) {
            if (!confirm('Delete this plan?')) return;
            await fetch(`${API}/api/admin/plans/${id}`, {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${token}` }
            });
            loadPlans();
            loadStats();
        }

        async function loadAppointments() {
            const res = await fetch(`${API}/api/admin/appointments`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const appointments = await res.json();
            document.getElementById('appointmentsList').innerHTML =
                appointments.map(apt => `
                <div class="bg-gray-900 border border-gray-800 
                            rounded-xl p-5 flex justify-between 
                            items-center">
                    <div>
                        <div class="font-medium">
                            Customer: ${apt.customerId} → 
                            Agent: ${apt.agentId}
                        </div>
                        <div class="text-gray-400 text-sm mt-1">
                            ${apt.date} at ${apt.timeSlot}
                        </div>
                        <div class="text-gray-500 text-sm">
                            ${apt.reason}
                        </div>
                    </div>
                    <span class="px-3 py-1 rounded-full text-xs 
                                font-medium ${apt.status === 'CONFIRMED'
                        ? 'bg-green-900/30 text-green-400'
                        : apt.status === 'CANCELLED'
                            ? 'bg-red-900/30 text-red-400'
                            : 'bg-yellow-900/30 text-yellow-400'
                    }">
                        ${apt.status}
                    </span>
                </div>
            `).join('');
        }

        async function addPlan() {
            const planName = document.getElementById('planName').value;
            const planType = document.getElementById('planType').value;
            const planDescription =
                document.getElementById('planDesc').value;

            const res = await fetch(`${API}/api/admin/plans`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({
                    planName, planType, planDescription
                })
            });

            if (res.ok) {
                const msg = document.getElementById('planSuccess');
                msg.classList.remove('hidden');
                msg.textContent = 'Plan added successfully!';
                setTimeout(() => msg.classList.add('hidden'), 3000);
                loadStats();
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../login.html';
        }

        // Load on start
        loadStats();
        loadUsers();
    </script>

</body>

</html>
