<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard — InsureAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-purple-600 rounded-lg 
                            flex items-center justify-center">
                    <span class="text-white font-bold text-sm">AI</span>
                </div>
                <span class="text-xl font-bold">InsureAI</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="userName" class="text-gray-400 text-sm"></span>
                <button onclick="logout()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 
                               rounded-lg text-sm transition">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">

        <!-- Welcome -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold">
                Welcome, <span id="welcomeName" class="text-purple-400"></span>!
            </h1>
            <p class="text-gray-400 mt-1">
                Manage your insurance and appointments
            </p>
        </div>

        <!-- Tabs -->
        <div class="flex gap-2 mb-8 border-b border-gray-800">
            <button onclick="showTab('plans')" id="tab-plans" class="px-4 py-2 text-sm font-medium border-b-2 
                           border-purple-500 text-purple-400 transition">
                Insurance Plans
            </button>
            <button onclick="showTab('appointments')" id="tab-appointments" class="px-4 py-2 text-sm font-medium border-b-2 
                           border-transparent text-gray-400 
                           hover:text-white transition">
                My Appointments
            </button>
            <button onclick="showTab('book')" id="tab-book" class="px-4 py-2 text-sm font-medium border-b-2 
                           border-transparent text-gray-400 
                           hover:text-white transition">
                Book Appointment
            </button>
            <button onclick="showTab('voice')" id="tab-voice" class="px-4 py-2 text-sm font-medium border-b-2 
                           border-transparent text-gray-400 
                           hover:text-white transition">
                🎙️ Voice AI
            </button>
        </div>

        <!-- Plans Tab -->
        <div id="tab-content-plans">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">Available Plans</h2>
                <button onclick="loadPlans()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 
                               rounded-lg text-sm transition">
                    Refresh
                </button>
            </div>
            <div id="plansList" class="grid md:grid-cols-3 gap-4">
                <div class="text-gray-500 text-sm">Loading plans...</div>
            </div>
        </div>

        <!-- Appointments Tab -->
        <div id="tab-content-appointments" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">My Appointments</h2>
                <button onclick="loadAppointments()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 
                               rounded-lg text-sm transition">
                    Refresh
                </button>
            </div>
            <div id="appointmentsList" class="space-y-4">
                <div class="text-gray-500 text-sm">
                    Loading appointments...
                </div>
            </div>
        </div>

        <!-- Book Appointment Tab -->
        <div id="tab-content-book" class="hidden">
            <div class="max-w-lg">
                <h2 class="text-xl font-semibold mb-6">
                    Book Appointment
                </h2>

                <div id="bookSuccess" class="hidden bg-green-900/30 border border-green-700/50 
                            text-green-400 rounded-lg px-4 py-3 mb-6 text-sm">
                </div>
                <div id="bookError" class="hidden bg-red-900/30 border border-red-700/50 
                            text-red-400 rounded-lg px-4 py-3 mb-6 text-sm">
                </div>

                <div class="bg-gray-900 border border-gray-800 
                            rounded-2xl p-6 space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">
                            Agent ID
                        </label>
                        <input id="agentId" type="number" placeholder="Enter agent ID" class="w-full bg-gray-800 border border-gray-700 
                                      rounded-xl px-4 py-3 text-white 
                                      placeholder-gray-500 focus:outline-none 
                                      focus:border-purple-500 transition" />
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">
                            Date
                        </label>
                        <input id="bookDate" type="date" class="w-full bg-gray-800 border border-gray-700 
                                      rounded-xl px-4 py-3 text-white 
                                      focus:outline-none focus:border-purple-500 
                                      transition" />
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">
                            Time Slot
                        </label>
                        <select id="timeSlot" class="w-full bg-gray-800 border border-gray-700 
                                       rounded-xl px-4 py-3 text-white 
                                       focus:outline-none focus:border-purple-500 
                                       transition">
                            <option>09:00 AM</option>
                            <option>10:00 AM</option>
                            <option>11:00 AM</option>
                            <option>12:00 PM</option>
                            <option>02:00 PM</option>
                            <option>03:00 PM</option>
                            <option>04:00 PM</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">
                            Reason
                        </label>
                        <textarea id="reason" rows="3" placeholder="Reason for appointment..." class="w-full bg-gray-800 border border-gray-700 
                                         rounded-xl px-4 py-3 text-white 
                                         placeholder-gray-500 focus:outline-none 
                                         focus:border-purple-500 transition">
                        </textarea>
                    </div>
                    <button onclick="bookAppointment()" class="w-full bg-purple-600 hover:bg-purple-700 
                                   rounded-xl py-3 font-semibold transition">
                        Book Appointment
                    </button>
                </div>
            </div>
        </div>

        <!-- Voice AI Tab -->
        <div id="tab-content-voice" class="hidden">
            <div class="max-w-2xl mx-auto text-center">
                <h2 class="text-xl font-semibold mb-2">Voice AI Assistant</h2>
                <p class="text-gray-400 mb-8">
                    Ask any insurance related question using your voice
                </p>

                <!-- Mic Button -->
                <div class="flex justify-center mb-8">
                    <button id="micBtn" onclick="toggleVoice()" class="w-24 h-24 bg-purple-600 hover:bg-purple-700 
                                   rounded-full flex items-center justify-center 
                                   text-4xl transition shadow-lg 
                                   shadow-purple-900/50">
                        🎙️
                    </button>
                </div>

                <div id="voiceStatus" class="text-gray-400 text-sm mb-4">
                    Click the mic to start speaking
                </div>

                <!-- Transcript -->
                <div id="transcript" class="bg-gray-900 border border-gray-800 rounded-xl 
                            p-4 text-left mb-4 min-h-16 text-gray-300 
                            text-sm hidden">
                </div>

                <!-- AI Response -->
                <div id="aiResponse" class="bg-purple-900/20 border border-purple-700/30 
                            rounded-xl p-4 text-left text-sm hidden">
                    <div class="text-purple-400 font-medium mb-2">
                        AI Response:
                    </div>
                    <div id="aiResponseText" class="text-gray-300"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API = 'http://localhost:8081';
        const token = localStorage.getItem('token');
        const name = localStorage.getItem('name');
        const userId = 1; // Replace with actual user ID from token

        // Set user name
        document.getElementById('userName').textContent = name;
        document.getElementById('welcomeName').textContent = name;

        // Redirect if not logged in
        if (!token) window.location.href = '../login.html';

        // Tab switching
        function showTab(tab) {
            const tabs = ['plans', 'appointments', 'book', 'voice'];
            tabs.forEach(t => {
                document.getElementById(`tab-content-${t}`)
                    .classList.add('hidden');
                document.getElementById(`tab-${t}`)
                    .classList.remove('border-purple-500', 'text-purple-400');
                document.getElementById(`tab-${t}`)
                    .classList.add('border-transparent', 'text-gray-400');
            });
            document.getElementById(`tab-content-${tab}`)
                .classList.remove('hidden');
            document.getElementById(`tab-${tab}`)
                .classList.add('border-purple-500', 'text-purple-400');
            document.getElementById(`tab-${tab}`)
                .classList.remove('border-transparent', 'text-gray-400');

            if (tab === 'plans') loadPlans();
            if (tab === 'appointments') loadAppointments();
        }

        // Load Plans
        async function loadPlans() {
            try {
                const res = await fetch(`${API}/api/admin/plans`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const plans = await res.json();
                const container = document.getElementById('plansList');

                if (plans.length === 0) {
                    container.innerHTML =
                        '<p class="text-gray-500">No plans available</p>';
                    return;
                }

                container.innerHTML = plans.map(plan => `
                    <div class="bg-gray-900 border border-gray-800 
                                rounded-2xl p-6 hover:border-purple-700/50 
                                transition">
                        <div class="inline-block bg-purple-900/30 text-purple-400 
                                    text-xs px-3 py-1 rounded-full mb-3">
                            ${plan.planType}
                        </div>
                        <h3 class="font-semibold text-lg mb-2">
                            ${plan.planName}
                        </h3>
                        <p class="text-gray-400 text-sm">
                            ${plan.planDescription}
                        </p>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('plansList').innerHTML =
                    '<p class="text-red-400">Failed to load plans</p>';
            }
        }

        // Load Appointments
        async function loadAppointments() {
            try {
                const res = await fetch(
                    `${API}/api/customer/appointments/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const appointments = await res.json();
                const container =
                    document.getElementById('appointmentsList');

                if (appointments.length === 0) {
                    container.innerHTML =
                        '<p class="text-gray-500">No appointments found</p>';
                    return;
                }

                container.innerHTML = appointments.map(apt => `
                    <div class="bg-gray-900 border border-gray-800 
                                rounded-xl p-5 flex justify-between 
                                items-center">
                        <div>
                            <div class="font-medium">
                                Agent ID: ${apt.agentId}
                            </div>
                            <div class="text-gray-400 text-sm mt-1">
                                ${apt.date} at ${apt.timeSlot}
                            </div>
                            <div class="text-gray-500 text-sm">
                                ${apt.reason}
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="px-3 py-1 rounded-full text-xs 
                                        font-medium ${apt.status === 'CONFIRMED'
                        ? 'bg-green-900/30 text-green-400'
                        : apt.status === 'CANCELLED'
                            ? 'bg-red-900/30 text-red-400'
                            : 'bg-yellow-900/30 text-yellow-400'
                    }">
                                ${apt.status}
                            </span>
                            ${apt.status === 'PENDING' ? `
                            <button onclick="cancelAppointment(${apt.id})"
                                    class="text-red-400 hover:text-red-300 
                                           text-sm transition">
                                Cancel
                            </button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('appointmentsList').innerHTML =
                    '<p class="text-red-400">Failed to load appointments</p>';
            }
        }

        // Book Appointment
        async function bookAppointment() {
            const agentId = document.getElementById('agentId').value;
            const date = document.getElementById('bookDate').value;
            const timeSlot = document.getElementById('timeSlot').value;
            const reason = document.getElementById('reason').value;
            const successMsg = document.getElementById('bookSuccess');
            const errorMsg = document.getElementById('bookError');

            try {
                const res = await fetch(
                    `${API}/api/customer/appointments/book`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        customerId: userId,
                        agentId: parseInt(agentId),
                        date, timeSlot, reason
                    })
                });

                if (res.ok) {
                    successMsg.classList.remove('hidden');
                    successMsg.textContent =
                        'Appointment booked successfully!';
                    errorMsg.classList.add('hidden');
                } else {
                    const err = await res.text();
                    errorMsg.classList.remove('hidden');
                    errorMsg.textContent = err;
                    successMsg.classList.add('hidden');
                }
            } catch (err) {
                errorMsg.classList.remove('hidden');
                errorMsg.textContent = 'Failed to book appointment!';
            }
        }

        // Cancel Appointment
        async function cancelAppointment(id) {
            await fetch(
                `${API}/api/customer/appointments/${id}/cancel`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadAppointments();
        }

        // Voice AI
        let recognition;
        let isListening = false;

        function toggleVoice() {
            if (isListening) {
                recognition.stop();
                return;
            }

            const SpeechRecognition = window.SpeechRecognition
                || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                document.getElementById('voiceStatus').textContent =
                    'Voice not supported in this browser. Use Chrome!';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('micBtn').classList
                    .add('bg-red-600');
                document.getElementById('micBtn').classList
                    .remove('bg-purple-600');
                document.getElementById('voiceStatus').textContent =
                    'Listening... speak now!';
            };

            recognition.onresult = async (event) => {
                const transcript =
                    event.results[0][0].transcript;
                document.getElementById('transcript')
                    .classList.remove('hidden');
                document.getElementById('transcript')
                    .textContent = `You said: "${transcript}"`;
                document.getElementById('voiceStatus').textContent =
                    'Processing your query...';
                await getAIResponse(transcript);
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('micBtn').classList
                    .remove('bg-red-600');
                document.getElementById('micBtn').classList
                    .add('bg-purple-600');
                document.getElementById('voiceStatus').textContent =
                    'Click the mic to start speaking';
            };

            recognition.start();
        }

        async function getAIResponse(query) {
            try {
                const res = await fetch(
                    'https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': 'YOUR_CLAUDE_API_KEY',
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-6',
                        max_tokens: 300,
                        messages: [{
                            role: 'user',
                            content: `You are an insurance assistant. 
                                     Answer this query briefly: ${query}`
                        }]
                    })
                });

                const data = await res.json();
                const answer = data.content[0].text;

                document.getElementById('aiResponse')
                    .classList.remove('hidden');
                document.getElementById('aiResponseText')
                    .textContent = answer;
                document.getElementById('voiceStatus').textContent =
                    'Done! Click mic to ask another question.';
            } catch (err) {
                document.getElementById('voiceStatus').textContent =
                    'AI response failed. Try again!';
            }
        }

        // Logout
        function logout() {
            localStorage.clear();
            window.location.href = '../login.html';
        }

        loadPlans();
    </script>

</body>

</html>
