<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — InsureAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white min-h-screen flex items-center 
             justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-purple-600 rounded-xl 
                        flex items-center justify-center mx-auto mb-4">
                <span class="text-white font-bold">AI</span>
            </div>
            <h1 class="text-2xl font-bold">Welcome Back</h1>
            <p class="text-gray-400 mt-1">Sign in to your account</p>
        </div>

        <!-- Card -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">

            <!-- Error Message -->
            <div id="errorMsg" class="hidden bg-red-900/30 border border-red-700/50 
                        text-red-400 rounded-lg px-4 py-3 mb-6 text-sm">
            </div>

            <!-- Form -->
            <div class="space-y-5">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">
                        Email
                    </label>
                    <input id="email" type="email" placeholder="you@example.com" class="w-full bg-gray-800 border border-gray-700 
                                  rounded-xl px-4 py-3 text-white 
                                  placeholder-gray-500 focus:outline-none 
                                  focus:border-purple-500 transition" />
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-2">
                        Password
                    </label>
                    <input id="password" type="password" placeholder="••••••••" class="w-full bg-gray-800 border border-gray-700 
                                  rounded-xl px-4 py-3 text-white 
                                  placeholder-gray-500 focus:outline-none 
                                  focus:border-purple-500 transition" />
                </div>

                <button onclick="login()" class="w-full bg-purple-600 hover:bg-purple-700 
                               rounded-xl py-3 font-semibold transition 
                               shadow-lg shadow-purple-900/50">
                    Sign In
                </button>
            </div>

            <p class="text-center text-gray-500 text-sm mt-6">
                Don't have an account?
                <a href="register.html" class="text-purple-400 hover:text-purple-300">
                    Register
                </a>
            </p>
        </div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch(
                    'http://localhost:8081/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save token and user info
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('name', data.name);

                    // Redirect based on role
                    if (data.role === 'ADMIN') {
                        window.location.href = 'admin/dashboard.html';
                    } else if (data.role === 'AGENT') {
                        window.location.href = 'agent/dashboard.html';
                    } else {
                        window.location.href = 'customer/dashboard.html';
                    }
                } else {
                    errorMsg.classList.remove('hidden');
                    errorMsg.textContent = 'Invalid email or password!';
                }
            } catch (err) {
                errorMsg.classList.remove('hidden');
                errorMsg.textContent = 'Server error. Please try again!';
            }
        }
    </script>

</body>

</html>
