<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard — InsureAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-purple-600 rounded-lg 
                            flex items-center justify-center">
                    <span class="text-white font-bold text-sm">AI</span>
                </div>
                <span class="text-xl font-bold">InsureAI</span>
                <span class="ml-2 text-xs bg-purple-900/50 text-purple-400 
                             px-2 py-1 rounded-full">Agent</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="userName" class="text-gray-400 text-sm"></span>
                <button onclick="logout()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 
                               rounded-lg text-sm transition">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">

        <div class="mb-8">
            <h1 class="text-3xl font-bold">Agent Dashboard</h1>
            <p class="text-gray-400 mt-1">
                Manage your appointments and availability
            </p>
        </div>

        <!-- Tabs -->
        <div class="flex gap-2 mb-8 border-b border-gray-800">
            <button onclick="showTab('appointments')" id="tab-appointments" class="px-4 py-2 text-sm font-medium border-b-2 
                           border-purple-500 text-purple-400 transition">
                My Appointments
            </button>
            <button onclick="showTab('availability')" id="tab-availability" class="px-4 py-2 text-sm font-medium border-b-2 
                           border-transparent text-gray-400 
                           hover:text-white transition">
                Set Availability
            </button>
        </div>

        <!-- Appointments Tab -->
        <div id="tab-content-appointments">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">My Appointments</h2>
                <button onclick="loadAppointments()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 
                               rounded-lg text-sm transition">
                    Refresh
                </button>
            </div>
            <div id="appointmentsList" class="space-y-4">
                <div class="text-gray-500 text-sm">
                    Loading appointments...
                </div>
            </div>
        </div>

        <!-- Availability Tab -->
        <div id="tab-content-availability" class="hidden">
            <div class="max-w-lg">
                <h2 class="text-xl font-semibold mb-6">Set Availability</h2>

                <div id="availSuccess" class="hidden bg-green-900/30 border border-green-700/50 
                            text-green-400 rounded-lg px-4 py-3 mb-4 text-sm">
                </div>

                <div class="bg-gray-900 border border-gray-800 
                            rounded-2xl p-6 space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">
                            Date
                        </label>
                        <input id="availDate" type="date" class="w-full bg-gray-800 border border-gray-700 
                                      rounded-xl px-4 py-3 text-white 
                                      focus:outline-none focus:border-purple-500 
                                      transition" />
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">
                            Time Slot
                        </label>
                        <select id="availTimeSlot" class="w-full bg-gray-800 border border-gray-700 
                                       rounded-xl px-4 py-3 text-white 
                                       focus:outline-none focus:border-purple-500 
                                       transition">
                            <option>09:00 AM</option>
                            <option>10:00 AM</option>
                            <option>11:00 AM</option>
                            <option>12:00 PM</option>
                            <option>02:00 PM</option>
                            <option>03:00 PM</option>
                            <option>04:00 PM</option>
                        </select>
                    </div>
                    <button onclick="setAvailability()" class="w-full bg-purple-600 hover:bg-purple-700 
                                   rounded-xl py-3 font-semibold transition">
                        Add Availability Slot
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8081';
        const token = localStorage.getItem('token');
        const name = localStorage.getItem('name');
        const agentId = 2; // Replace with actual agent ID

        document.getElementById('userName').textContent = name;
        if (!token) window.location.href = '../login.html';

        function showTab(tab) {
            ['appointments', 'availability'].forEach(t => {
                document.getElementById(`tab-content-${t}`)
                    .classList.add('hidden');
                document.getElementById(`tab-${t}`)
                    .classList.remove('border-purple-500', 'text-purple-400');
                document.getElementById(`tab-${t}`)
                    .classList.add('border-transparent', 'text-gray-400');
            });
            document.getElementById(`tab-content-${tab}`)
                .classList.remove('hidden');
            document.getElementById(`tab-${tab}`)
                .classList.add('border-purple-500', 'text-purple-400');
            if (tab === 'appointments') loadAppointments();
        }

        async function loadAppointments() {
            try {
                const res = await fetch(
                    `${API}/api/agent/appointments/${agentId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const appointments = await res.json();
                const container =
                    document.getElementById('appointmentsList');

                if (appointments.length === 0) {
                    container.innerHTML =
                        '<p class="text-gray-500">No appointments yet</p>';
                    return;
                }

                container.innerHTML = appointments.map(apt => `
                    <div class="bg-gray-900 border border-gray-800 
                                rounded-xl p-5 flex justify-between 
                                items-center">
                        <div>
                            <div class="font-medium">
                                Customer ID: ${apt.customerId}
                            </div>
                            <div class="text-gray-400 text-sm mt-1">
                                ${apt.date} at ${apt.timeSlot}
                            </div>
                            <div class="text-gray-500 text-sm">
                                ${apt.reason}
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="px-3 py-1 rounded-full text-xs 
                                        font-medium ${apt.status === 'CONFIRMED'
                        ? 'bg-green-900/30 text-green-400'
                        : apt.status === 'CANCELLED'
                            ? 'bg-red-900/30 text-red-400'
                            : 'bg-yellow-900/30 text-yellow-400'
                    }">
                                ${apt.status}
                            </span>
                            ${apt.status === 'PENDING' ? `
                            <button onclick="updateStatus(${apt.id},'CONFIRMED')"
                                    class="px-3 py-1 bg-green-700 
                                           hover:bg-green-600 rounded-lg 
                                           text-xs transition">
                                Confirm
                            </button>
                            <button onclick="updateStatus(${apt.id},'CANCELLED')"
                                    class="px-3 py-1 bg-red-800 
                                           hover:bg-red-700 rounded-lg 
                                           text-xs transition">
                                Cancel
                            </button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('appointmentsList').innerHTML =
                    '<p class="text-red-400">Failed to load</p>';
            }
        }

        async function updateStatus(id, status) {
            await fetch(
                `${API}/api/agent/appointments/${id}/status?status=${status}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadAppointments();
        }

        async function setAvailability() {
            const date = document.getElementById('availDate').value;
            const timeSlot =
                document.getElementById('availTimeSlot').value;

            const res = await fetch(`${API}/api/agent/availability`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    agentId, date, timeSlot, isAvailable: true
                })
            });

            if (res.ok) {
                const msg = document.getElementById('availSuccess');
                msg.classList.remove('hidden');
                msg.textContent = 'Availability slot added!';
                setTimeout(() => msg.classList.add('hidden'), 3000);
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../login.html';
        }

        loadAppointments();
    </script>

</body>

</html>
