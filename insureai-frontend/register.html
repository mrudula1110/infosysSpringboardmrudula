<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — InsureAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white min-h-screen flex items-center 
             justify-center px-4 py-10">

    <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-purple-600 rounded-xl 
                        flex items-center justify-center mx-auto mb-4">
                <span class="text-white font-bold">AI</span>
            </div>
            <h1 class="text-2xl font-bold">Create Account</h1>
            <p class="text-gray-400 mt-1">Join InsureAI today</p>
        </div>

        <!-- Card -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">

            <!-- Success Message -->
            <div id="successMsg" class="hidden bg-green-900/30 border border-green-700/50 
                        text-green-400 rounded-lg px-4 py-3 mb-6 text-sm">
            </div>

            <!-- Error Message -->
            <div id="errorMsg" class="hidden bg-red-900/30 border border-red-700/50 
                        text-red-400 rounded-lg px-4 py-3 mb-6 text-sm">
            </div>

            <div class="space-y-4">

                <div>
                    <label class="block text-sm text-gray-400 mb-2">
                        Full Name
                    </label>
                    <input id="name" type="text" placeholder="John Doe" class="w-full bg-gray-800 border border-gray-700 
                                  rounded-xl px-4 py-3 text-white 
                                  placeholder-gray-500 focus:outline-none 
                                  focus:border-purple-500 transition" />
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-2">
                        Email
                    </label>
                    <input id="email" type="email" placeholder="you@example.com" class="w-full bg-gray-800 border border-gray-700 
                                  rounded-xl px-4 py-3 text-white 
                                  placeholder-gray-500 focus:outline-none 
                                  focus:border-purple-500 transition" />
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-2">
                        Password
                    </label>
                    <input id="password" type="password" placeholder="••••••••" class="w-full bg-gray-800 border border-gray-700 
                                  rounded-xl px-4 py-3 text-white 
                                  placeholder-gray-500 focus:outline-none 
                                  focus:border-purple-500 transition" />
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-2">
                        Role
                    </label>
                    <select id="role" class="w-full bg-gray-800 border border-gray-700 
                                   rounded-xl px-4 py-3 text-white 
                                   focus:outline-none focus:border-purple-500 
                                   transition">
                        <option value="CUSTOMER">Customer</option>
                        <option value="AGENT">Agent</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-2">
                        Address
                    </label>
                    <input id="address" type="text" placeholder="Your city" class="w-full bg-gray-800 border border-gray-700 
                                  rounded-xl px-4 py-3 text-white 
                                  placeholder-gray-500 focus:outline-none 
                                  focus:border-purple-500 transition" />
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-2">
                        Date of Birth
                    </label>
                    <input id="dob" type="date" class="w-full bg-gray-800 border border-gray-700 
                                  rounded-xl px-4 py-3 text-white 
                                  focus:outline-none focus:border-purple-500 
                                  transition" />
                </div>

                <button onclick="register()" class="w-full bg-purple-600 hover:bg-purple-700 
                               rounded-xl py-3 font-semibold transition 
                               shadow-lg shadow-purple-900/50 mt-2">
                    Create Account
                </button>
            </div>

            <p class="text-center text-gray-500 text-sm mt-6">
                Already have an account?
                <a href="login.html" class="text-purple-400 hover:text-purple-300">
                    Sign In
                </a>
            </p>
        </div>
    </div>

    <script>
        async function register() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const address = document.getElementById('address').value;
            const dob = document.getElementById('dob').value;

            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch(
                    'http://localhost:8081/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name, email, password, role, address, dob
                    })
                });

                const data = await response.text();

                if (response.ok) {
                    successMsg.classList.remove('hidden');
                    successMsg.textContent =
                        'Account created! Redirecting to login...';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    errorMsg.classList.remove('hidden');
                    errorMsg.textContent = data;
                }
            } catch (err) {
                errorMsg.classList.remove('hidden');
                errorMsg.textContent = 'Server error. Please try again!';
            }
        }
    </script>

</body>

</html>
